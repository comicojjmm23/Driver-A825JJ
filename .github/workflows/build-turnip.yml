name: Build Turnip Adreno 825 DriverJJ

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-pip python3-mako python3-yaml \
            bison flex libx11-dev libxext-dev libxfixes-dev libxcb-glx0-dev \
            libxcb-shm0-dev libx11-xcb-dev libxcb-dri2-0-dev libxcb-dri3-dev \
            libxcb-present-dev libxshmfence-dev libxrandr-dev gettext \
            glslang-tools zip pkg-config
          python3 -m pip install --break-system-packages meson

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Clone Mesa Gen8 Branch
        run: |
          git clone --depth 1 --branch turnip/gen8 https://github.com/whitebelyash/mesa-unified.git mesa-src

      - name: Generate Meson Cross File
        run: |
          NDK_PATH="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          echo "Using NDK at: $NDK_PATH"
          cat << EOF > android-aarch64.ini
          [binaries]
          c = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang'
          cpp = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang++'
          ar = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = '/usr/bin/pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'

          [built-in options]
          c_args = ['-O3', '-DNDEBUG', '-fomit-frame-pointer', '-march=armv8.2-a+fp16']
          cpp_args = ['-O3', '-DNDEBUG', '-fomit-frame-pointer', '-march=armv8.2-a+fp16']
          EOF
          cat android-aarch64.ini

      - name: Configure and Build
        run: |
          meson setup build-turnip mesa-src \
            --cross-file android-aarch64.ini \
            -Dbuildtype=release \
            -Doptimization=3 \
            -Db_ndebug=true \
            -Dplatforms=android \
            -Dplatform-sdk-version=31 \
            -Dandroid-stub=true \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Degl=disabled \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dglx=disabled \
            -Dopengl=false \
            -Db_lto=false \
            -Dstrip=true

          ninja -C build-turnip

      - name: Package Driver
        run: |
          mkdir -p driver_package
          SO_PATH=$(find build-turnip -name "libvulkan_freedreno.so" -o -name "vulkan.freedreno.so" | head -n 1)
          echo "Found compiled library at: $SO_PATH"
          cp "$SO_PATH" driver_package/vulkan.adreno.so
          
          cat << 'EOF' > driver_package/meta.json
          {
            "name": "Turnip Adreno 825 JJ Custom O3",
            "description": "Compilado desde rama turnip/gen8 con optimizaciones O3 para BotW",
            "author": "comicojjmm23",
            "packageVersion": "1",
            "vendor": "Mesa/whitebelyash",
            "driverVersion": "Gen8-v31-A825",
            "minApi": 31,
            "libraryName": "vulkan.adreno.so"
          }
          EOF

          cd driver_package
          zip -r ../Turnip-A825-JJ-BotW.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-A825-JJ-BotW
          path: Turnip-A825-JJ-BotW.zip

name: Build Turnip Adreno 825 DriverJJ

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-pip python3-mako python3-yaml \
            bison flex libx11-dev libxext-dev libxfixes-dev libxcb-glx0-dev \
            libxcb-shm0-dev libx11-xcb-dev libxcb-dri2-0-dev libxcb-dri3-dev \
            libxcb-present-dev libxshmfence-dev libxrandr-dev gettext \
            glslang-tools zip
          python3 -m pip install --break-system-packages meson

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Clone Mesa Main
        run: |
          git clone --depth 1 https://gitlab.freedesktop.org/mesa/mesa.git mesa-src

      - name: Generate Meson Cross File
        run: |
          NDK_PATH="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          echo "Using NDK at: $NDK_PATH"
          cat << EOF > android-aarch64.ini
          [binaries]
          c = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang'
          cpp = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang++'
          ar = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = 'false'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF
          cat android-aarch64.ini

      - name: Configure and Build
        run: |
          meson setup build-turnip mesa-src \
            --cross-file android-aarch64.ini \
            -Dbuildtype=release \
            -Dplatforms=android \
            -Dplatform-sdk-version=31 \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Db_lto=true \
            -Dstrip=true

          ninja -C build-turnip src/freedreno/vulkan/vulkan.freedreno.so

      - name: Package Driver
        run: |
          mkdir -p driver_package
          cp build-turnip/src/freedreno/vulkan/vulkan.freedreno.so driver_package/vulkan.adreno.so
          
          cat << 'EOF' > driver_package/meta.json
          {
            "name": "Turnip Adreno 825 JJ Custom",
            "description": "Compilado para Adreno 825 / 8xx optimizado para BotW",
            "author": "comicojjmm23",
            "packageVersion": "1",
            "vendor": "Mesa",
            "driverVersion": "Custom-A825",
            "minApi": 31,
            "libraryName": "vulkan.adreno.so"
          }
          EOF

          cd driver_package
          zip -r ../Turnip-A825-BotW.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-A825-BotW
          path: Turnip-A825-BotW.zip
